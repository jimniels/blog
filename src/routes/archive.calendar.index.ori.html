---
(site) => {
  page = {
    title: "Calendar",
    path: "/archive/calendar/",
    head: `
      <style>
        .calendar-year {
          scroll-margin-top: var(--s-16);
        }
        .calendar-year + .calendar-year {
          margin-top: var(--s-64);
        }
        .calendar-year h2 {
          font-size: 1.333rem;
          font-weight: 900;
          letter-spacing: -0.02rem;
          margin: 0 0 var(--s-24) 0;
          padding: var(--s-16) 0 var(--s-8);
          border-bottom: 1px solid var(--c-border);
          background: var(--c-bg);
          position: sticky;
          top: 0;
          z-index: 1;
        }
        .calendar-months {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: var(--s-32) var(--s-12);
        }
        .calendar-month h3 {
          font-size: 0.888rem;
          margin: 0 0 var(--s-8) 0;
        }
        .calendar-month--future,
        .calendar-day--future {
          color: var(--c-text-light);
        }
        .calendar-grid {
          display: grid;
          grid-template-columns: repeat(7, 1fr);
          font-size: 0.65rem;
          font-variant-numeric: tabular-nums;
          line-height: 1;
        }
        .calendar-day {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 1.6em;
        }
        .calendar-day--has-post {
          position: relative;
        }
        .calendar-month:has(:checked),
        .calendar-year:has(:checked) {
          z-index: 2;
          position: relative;
        }
        .calendar-day-check {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          clip-path: inset(50%);
          white-space: nowrap;
        }
        .calendar-day--post {
          width: 1.35em;
          height: 1.35em;
          min-width: 1.35em;
          min-height: 1.35em;
          aspect-ratio: 1;
          border-radius: 50%;
          background: var(--c-theme);
          cursor: pointer;
          justify-self: center;
          align-self: center;
          flex-shrink: 0;
        }
        .calendar-day--post:hover {
          opacity: 0.75;
        }
        .calendar-day-check:focus-visible + .calendar-day--post,
        .calendar-day-check:checked + .calendar-day--post {
          outline: 2px solid var(--c-theme);
          outline-offset: 3px;
          opacity: 1;
        }
        .calendar-day--posts {
          gap: 2px;
        }
        .calendar-day--posts .calendar-day--post {
          width: 1em;
          height: 1em;
          min-width: 1em;
          min-height: 1em;
        }
        .calendar-popover {
          --popover-shift: 0px;
          display: none;
          position: absolute;
          top: calc(100% + 0.4em);
          left: 50%;
          translate: calc(-50% + var(--popover-shift)) 0;
          z-index: 5;
          width: max-content;
          max-width: min(12rem, calc(100vw - 2rem));
          padding: var(--s-8) var(--s-12);
          background: var(--c-bg);
          border: 1px solid var(--c-fg);
          border-radius: var(--border-radius);
          box-shadow: 0 8px 24px hsl(var(--c-theme-h) var(--c-theme-s) 0% / 0.18);
          color: inherit;
          font-size: 0.75rem;
          font-weight: 600;
          line-height: 1.3;
          text-align: left;
          text-decoration: none;
        }
        .calendar-day-check:checked ~ .calendar-popover {
          display: block;
        }
        /* Left-hand months grow right; right-hand months grow left */
        .calendar-month:nth-child(3n + 1) .calendar-popover {
          left: 0;
          translate: var(--popover-shift) 0;
        }
        .calendar-month:nth-child(3n) .calendar-popover {
          left: auto;
          right: 0;
          translate: var(--popover-shift) 0;
        }
        /* Sunday / Saturday columns pin to the inward side */
        .calendar-day:nth-child(7n + 1) .calendar-popover {
          left: 0;
          right: auto;
          translate: var(--popover-shift) 0;
        }
        .calendar-day:nth-child(7n) .calendar-popover {
          left: auto;
          right: 0;
          translate: var(--popover-shift) 0;
        }
        .calendar-popover:hover {
          text-decoration: underline;
          filter: none;
        }
      </style>
    `
  }

  return = <server/Layouts.js>.Page({ site, page }, _template())
}.return
---

<main class="wrapper">
  ${<server/ArchiveToggle.js>("calendar", site)}
  ${<server/PostsCalendar.js>(Tree.plain(site.posts))}
</main>
<script>
  (function () {
    function closeChecks(except) {
      document.querySelectorAll(".calendar-day-check:checked").forEach(function (el) {
        if (el !== except) el.checked = false;
      });
    }

    function shiftPopoverIntoView(check) {
      var pop = document.getElementById(check.getAttribute("aria-controls"));
      if (!pop) return;
      pop.style.setProperty("--popover-shift", "0px");
      requestAnimationFrame(function () {
        var rect = pop.getBoundingClientRect();
        var pad = 16;
        var dx = 0;
        if (rect.left < pad) dx += pad - rect.left;
        if (rect.right + dx > window.innerWidth - pad) {
          dx -= rect.right + dx - (window.innerWidth - pad);
        }
        pop.style.setProperty("--popover-shift", Math.round(dx) + "px");
      });
    }

    document.addEventListener("change", function (event) {
      var check = event.target;
      if (
        check.classList.contains("calendar-day-check") &&
        check.checked
      ) {
        closeChecks(check);
        shiftPopoverIntoView(check);
      }
    });

    document.addEventListener("click", function (event) {
      if (!event.target.closest(".calendar-day--has-post")) {
        closeChecks();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") closeChecks();
    });
  })();
</script>
