---
() => _template()
---

<form action="https://duckduckgo.com" class="home-search" role="search">
  <label for="home-search-input" class="home-search-label">Search the blog</label>
  <input id="home-search-input" type="search" name="q" placeholder="Search…"
    autocomplete="off" spellcheck="false" aria-controls="home-search-results" />
  <input type="hidden" name="sites" value="blog.jim-nielsen.com" />
  <span class="home-search-icon" aria-hidden="true">${../icons/Heroicons.ori/search}</span>
  <span class="home-search-spinner" aria-hidden="true" hidden></span>
  <button type="button" class="home-search-clear" aria-label="Clear search" title="Clear search" hidden>
    ${../icons/Heroicons.ori/x-mark}
  </button>
</form>
