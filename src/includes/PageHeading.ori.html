---
// Page title with a compact tab switcher, shared by Archive and Links.
({ title, navLabel, active, tabs }) => _template()
---
<div class="page-heading">
  <h1>${title}</h1>
  <nav class="page-toggle" aria-label="${navLabel}">
    ${Tree.map(tabs, (tab) => `
      <a
        href="${tab.href}"
        ${tab.id === active ? `aria-current="page"` : ""}
        >${tab.label}</a
      >
    `)}
  </nav>
</div>
